<title>Dermatouch Offline Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F6;--surface:#FFFFFF;--surface2:#EDF3F2;--ink:#2F2A26;--ink2:#5D6662;--ink3:#8A9490;--line:#DCE4E2;
  --teal:#1E9E8E;--teal-d:#11645C;--teal-s:#DCF0EC;--amber:#A8640F;--amber-s:#FBEEDA;--red:#B23A2E;--red-s:#F8E2DF;--green:#2B7A4B;--green-s:#E0F0E6;
  --shadow:0 1px 2px rgba(47,42,38,.06),0 6px 24px rgba(47,42,38,.06);
  --r-lg:18px;--r-md:12px;--r-sm:8px;
  --f-head:'Jost','Futura','Century Gothic','Avenir Next',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111716;--surface:#192120;--surface2:#202A29;--ink:#E7EDEB;--ink2:#A2AEAB;--ink3:#75817E;--line:#2B3735;
  --teal:#3CC2B0;--teal-d:#93E0D5;--teal-s:#15332E;--amber:#E7A74C;--amber-s:#382A15;--red:#F0806F;--red-s:#3A1F1B;--green:#6CC690;--green-s:#17301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111716;--surface:#192120;--surface2:#202A29;--ink:#E7EDEB;--ink2:#A2AEAB;--ink3:#75817E;--line:#2B3735;
  --teal:#3CC2B0;--teal-d:#93E0D5;--teal-s:#15332E;--amber:#E7A74C;--amber-s:#382A15;--red:#F0806F;--red-s:#3A1F1B;--green:#6CC690;--green-s:#17301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:500;margin:0;letter-spacing:.01em;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-d)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.logo-img{display:block}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;
  transition:opacity .5s ease,visibility .5s;padding:24px}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash-in{display:flex;flex-direction:column;align-items:center;text-align:center;
  width:min(240px,64vw);animation:lockRise .9s cubic-bezier(.22,1,.36,1) both}
@keyframes lockRise{from{transform:translateY(12px)}}

/* the mark draws itself with a teal pen, then fills in as solid ink */
.sp-mark{width:58%;height:auto;display:block;margin-bottom:9%;overflow:visible}
.sp-ink{fill:var(--ink);opacity:0;animation:inkIn .5s ease .95s forwards}
@keyframes inkIn{to{opacity:1}}
.sp-pen{fill:none;stroke:var(--teal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.6,.05,.3,1) forwards,penOut .45s ease 1s forwards}
.sp-pen.p2{animation-delay:.34s,1.1s}
.sp-pen.p3{animation-delay:.5s,1.15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes penOut{to{opacity:0}}

/* wordmark wipes in from the left, tagline settles after it */
.sp-word{width:100%;height:auto;display:block;
  clip-path:inset(0 100% 0 0);animation:wipe .62s cubic-bezier(.65,0,.35,1) 1.02s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.sp-tag{width:100%;height:auto;display:block;margin-top:3.5%;opacity:0;transform:scaleX(.94);
  transform-origin:left center;animation:tagIn .55s cubic-bezier(.22,1,.36,1) 1.42s forwards}
@keyframes tagIn{to{opacity:1;transform:none}}
.splash-msg{font-size:13px;color:var(--ink2);min-height:20px;margin-top:26px;opacity:0;
  animation:rise .5s 1.75s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.splash-msg b{color:var(--teal-d);font-weight:500}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---------- shell ---------- */
#app{display:flex;min-height:100%}
.rail{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:58px}
.top .mini{width:27px;height:auto;flex:none;color:var(--ink)}
.top-title{font-family:var(--f-head);font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:5px 10px;border-radius:99px;background:var(--surface2);border:0;cursor:pointer;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.sync.live i{background:var(--teal);box-shadow:0 0 0 0 var(--teal);animation:pulse 2.4s infinite}
.sync.busy i{background:var(--amber)}
.sync.err i{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--teal) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#view{padding:16px 14px 110px;max-width:1320px;width:100%;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--ink2);text-decoration:none;position:relative}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--teal-d)}
.tabs a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.tabs .badge,.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:17px;text-align:center}
@media (min-width:980px){
  .rail{display:flex;flex-direction:column;width:236px;flex:none;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px}
  .rail .brand{padding:4px 10px 22px}
  .rail .brand img{width:150px}
  .nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}

/* ---------- search ---------- */
.gsearch{position:relative;flex:0 1 380px;min-width:0}

.ac-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:min(62vh,440px);overflow:auto;z-index:50;display:none;padding:6px}

.ac-group{font-size:12px;color:var(--ink3);padding:8px 10px 4px}
.ac-empty{padding:14px;color:var(--ink2);font-size:14px}

/* ---------- building blocks ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.page-head h2{font-size:26px;line-height:1.15}

.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1200px){.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 12px;position:relative;cursor:default;min-width:0}

.kpi .v small{font-size:15px;color:var(--ink2);font-weight:400;margin-left:2px}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warn{border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.kpi.warn .v{color:var(--amber)}
.kpi.bad{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.kpi.bad .v{color:var(--red)}
.kpi.good .v{color:var(--teal-d)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0}

.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h3{font-size:18px}
.panel-head .sub{font-size:13px;color:var(--ink2)}
.cols2{grid-template-columns:1fr}
@media (min-width:980px){.cols2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.cols2.even{grid-template-columns:1fr 1fr}}
.mt{margin-top:12px}.mt2{margin-top:20px}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}
.nowrap{white-space:nowrap}
.mono{font-family:var(--f-body);letter-spacing:.01em}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:5px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.teal{background:var(--teal-s);color:var(--teal-d)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-bottom:12px;scrollbar-width:none}

.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.fbtn b{font-weight:600;color:var(--ink);margin-left:4px}
.fbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fbtn.on b{color:var(--surface)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}

:root[data-theme="dark"] .btn.primary{color:#0B1F1C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1F1C}}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.searchbox{position:relative}
.searchbox input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px;outline:none;font-size:15px}
.searchbox input:focus{border-color:var(--teal)}
.searchbox>svg{position:absolute;left:13px;top:13px;width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:1.8;stroke-linecap:round}
.searchbox.big input{height:56px;font-size:17px;border-radius:16px;padding-left:48px}
.searchbox.big>svg{left:17px;top:19px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);-webkit-overflow-scrolling:touch}
.tbl-wrap.flat{border:0;border-radius:0}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}

.tbl .skuc{font-weight:500;word-break:break-all;min-width:150px}

.neg{color:var(--red);font-weight:600}
.pos{color:var(--teal-d)}
.more-row{text-align:center;padding:12px}
/* list cards (phone) */
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}

.card .main{flex:1;min-width:0}
.card .t{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (min-width:980px){.m-only{display:none!important}}
.only-m{display:block}.only-d{display:none}
@media (min-width:760px){.only-m{display:none}.only-d{display:block}}

/* ---------- pipeline ---------- */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;margin:6px 0 4px}
.flow::before{content:"";position:absolute;left:10%;right:10%;top:17px;height:2px;background:var(--line)}
.flow .st{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;cursor:pointer;padding:0 2px}
.flow .dot{width:36px;height:36px;border-radius:50%;background:var(--surface);border:2px solid var(--teal);display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:13px;color:var(--teal-d);position:relative;z-index:1}
.flow .st.alert .dot{border-color:var(--amber);color:var(--amber)}
.flow .st.bad .dot{border-color:var(--red);color:var(--red)}
.flow .st .v{font-family:var(--f-head);font-size:24px;font-weight:500;margin-top:6px;line-height:1.1}
.flow .st .l{font-size:12px;color:var(--ink2);line-height:1.3}
.flow-line{position:absolute;left:10%;top:17px;height:2px;background:var(--teal);width:0;transition:width 1.2s cubic-bezier(.65,0,.35,1)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .b{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface)}
.tl .b svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tl li.ok .b{background:var(--teal);border-color:var(--teal)}
.tl li.warn .b{background:var(--amber);border-color:var(--amber)}
.tl li.bad .b{background:var(--red);border-color:var(--red)}
.tl .tt{font-weight:500}
.tl .ts{font-size:13px;color:var(--ink2)}

/* ---------- forms ---------- */
.form{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.form.two{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
.fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 12px;outline:none;font-size:15px}

.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal)}

.fld .ac{position:relative}
.calc{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.calc b{font-family:var(--f-head);font-size:20px;font-weight:500;display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal)}

/* ---------- sheet (drawer) ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,19,.42);z-index:70;opacity:0;visibility:hidden;transition:opacity .25s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;z-index:71;background:var(--surface);left:0;right:0;bottom:0;max-height:90vh;border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 18px 10px;border-bottom:1px solid var(--line);flex:none}

@media (min-width:980px){
  .sheet{left:auto;top:0;bottom:0;width:min(560px,46vw);max-height:none;border-radius:22px 0 0 22px;transform:translateX(105%)}

  .sheet-head{padding-top:20px}
}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.kv div{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}

.kv b{font-family:var(--f-head);font-weight:500;font-size:18px;display:block;word-break:break-word}
.kv b.s{font-size:15px;font-family:var(--f-body)}

/* ---------- misc ---------- */
.askwrap{position:fixed;inset:0;z-index:120;background:rgba(10,16,15,.5);display:grid;place-items:center;
  padding:22px;opacity:0;transition:opacity .2s}
.askwrap.on{opacity:1}
.askbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);transform:translateY(10px) scale(.97);transition:transform .22s cubic-bezier(.22,1,.36,1)}
.askwrap.on .askbox{transform:none}
.askbox p{margin:0 0 16px;font-size:15px;line-height:1.45}
.askrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* ---------- scanner ---------- */
.ac.has-scan input{padding-right:48px}
.ac-scan{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;border-radius:9px;background:var(--surface2);color:var(--teal-d);display:grid;place-items:center;cursor:pointer;z-index:1}
.ac-scan svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scan-count{margin-top:8px}
.lk-scan{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#scan{position:fixed;inset:0;z-index:150;background:#000;opacity:0;transition:opacity .22s ease;display:block;color:#fff;overflow:hidden;pointer-events:none}
#scan.on{opacity:1;pointer-events:auto}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;z-index:2;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(0,0,0,.6),transparent)}

.sc-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sc-btn.on{background:#fff;color:#000}
.sc-frame{position:absolute;left:50%;top:42%;width:min(78vw,340px);height:min(42vw,190px);transform:translate(-50%,-50%);border-radius:18px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.52);transition:box-shadow .25s}
.sc-frame i{position:absolute;width:28px;height:28px;border:3.5px solid #fff;border-radius:4px}
.sc-frame i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.sc-frame i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:16px}
.sc-frame i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:16px}
.sc-frame i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.sc-laser{position:absolute;left:8%;right:8%;height:2px;top:50%;background:#3CC2B0;border-radius:2px;box-shadow:0 0 12px 2px rgba(60,194,176,.75);
  animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{from{top:12%}to{top:88%}}
.sc-frame.ok i{border-color:#6CC690;animation:scOk .4s ease}

@keyframes scOk{50%{transform:scale(1.12)}}

.sc-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  padding:28px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.78) 30%)}

.sc-count{display:flex;flex-direction:column;align-items:center}

@keyframes pop2{40%{transform:scale(1.22)}}
.sc-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@media (prefers-reduced-motion:reduce){.sc-laser{animation:none;top:50%}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;z-index:170;opacity:0;pointer-events:none;transition:all .25s;max-width:min(92vw,460px);text-align:center}

.notice{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--amber-s);color:var(--ink);margin-bottom:14px}

.notice.red svg{stroke:var(--red)}.notice.teal svg{stroke:var(--teal-d)}
.notice b{font-weight:600}
.notice .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:34px 16px;text-align:center;color:var(--ink2)}
.empty h4{font-size:18px;color:var(--ink);margin-bottom:4px}

.rtype{display:inline-flex;gap:4px}.rtype i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:rbDot 1s infinite}.rtype i:nth-child(2){animation-delay:.15s}.rtype i:nth-child(3){animation-delay:.3s}
.rb-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.rb-chips::-webkit-scrollbar{display:none}
.rb-in{display:flex;gap:8px}.rb-in input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
body.gate #robo{display:none!important}
body:not(.gate) #view::after{content:'';display:block;height:64px}
@media (prefers-reduced-motion:reduce){.rb *{animation:none!important}}

/* Install a web app manifest so "Add to home screen" opens as a real app
   with our own branded splash instead of a blank white page. */
(function () {
  try {
    var base = location.origin + location.pathname;
    var mf = {
      name: "Dermatouch Offline Ops", short_name: "DT Ops",
      description: "Live offline inventory, docs and dispatch for Dermatouch.",
      start_url: base, scope: base.replace(/[^/]*$/, ""),
      display: "standalone", orientation: "any",
      background_color: "#111716", theme_color: "#111716",
      icons: [
        { src: window.DT_ART.i192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: window.DT_ART.i512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: window.DT_ART.i512, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    var l = document.createElement("link");
    l.rel = "manifest";
    l.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(l);
  } catch (e) { }
})();
/* The free Netlify Drop badge floats over the bottom tab bar. Remove it
   wherever it appears, including if it is injected after load. */
(function () {
  var kill = function () {
    var hits = document.querySelectorAll('a[href*="netlify.com"],[id*="netlify"],[class*="netlify"]');
    for (var i = 0; i < hits.length; i++) {
      var n = hits[i];
      if (n.closest && n.closest("#view")) continue;
      var box = n.closest("div,aside,section") || n;
      var cs = box === n ? null : getComputedStyle(box);
      (cs && (cs.position === "fixed" || cs.position === "absolute") ? box : n).remove();
    }
  };

const E = (() => {

  const hk = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };

  function dkey(v) {
    if (v == null || v === '') return '';

      if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
      return `${y}-${pad(mo)}-${pad(d)}`;
    }
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;

  }
  const kd = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const diffDays = (a, b) => (a && b) ? Math.round((kd(b) - kd(a)) / 864e5) : null;
  const addDays = (k, n) => new Date(kd(k) + n * 864e5).toISOString().slice(0, 10);
  function ymd(fromK, toK) { // calendar Y/M/D between two keys (to >= from)

    let neg = false; if (toK < fromK) { [fromK, toK] = [toK, fromK]; neg = true; }

    let y = y2 - y1, m = m2 - m1, d = d2 - d1;

    if (m < 0) { y -= 1; m += 12; }
    return { y, m, d, neg };
  }

  function sheet(map, ...keys) {
    for (const k of keys) if (map[k]) return map[k].rows;
    for (const k of keys) { const f = Object.keys(map).find(x => x.includes(k)); if (f) return map[f].rows; }
    return null;
  }
  function cols(rows, spec) {
    if (!rows) return null;
    const keys = Object.keys(spec);
    for (let r = 0; r < Math.min(6, rows.length); r++) {
      const H = (rows[r] || []).map(hk); const idx = {}; let hit = 0;
      for (const k of keys) {
        let i = -1;

        if (i < 0) for (const a of spec[k]) { if (a.length < 3) continue; i = H.findIndex(h => h && h.startsWith(a)); if (i >= 0) break; }

  const STOCK_SPEC = { sku: ['SKUCODE', 'SKU'], name: ['ITEMNAME', 'NAME'], shelf: ['SHELF'], batch: ['BATCH'], atp: ['AVAILABLEATP', 'AVAILABLE', 'ATP'], color: ['COLOR', 'COLOUR'], exp: ['BATCHEXPIRY', 'EXPIRY'], vb: ['VENDORBATCHNUMBER', 'VENDORBATCH'] };
  function stockRows(rows) {

    const plain = al => al.map(({ r, ...x }) => x);
    for (const e of inw) {
      if (!after(e.date, e.time)) continue;
      const s = ensure(e.k, e.sku);
      if (catOf(e.shelf, '') === 'mkt') s.cat = 'mkt';
      let row = s.rows.find(x => nk(x.shelf) === nk(e.shelf) && nk(x.batch) === nk(e.batch) && x.inv !== 'BAD');
      if (!row) { row = { shelf: e.shelf, batch: e.batch, exp: e.exp || '', vb: e.vb || '', color: 'GOOD_INVENTORY', inv: 'GOOD', base: 0, inw: 0, dmg: 0, out: 0, added: true }; s.rows.push(row); }
      row.inw += e.qty; s.inw += e.qty; e.newBatch = !!row.added && !s.rows.some(x => x !== row && !x.added && nk(x.batch) === nk(e.batch));
      s.ledger.push({ date: e.date, time: e.time || '', type: 'Inward', ref: e.ref || '', qty: e.qty, batch: e.batch });
    }
    for (const e of dmg) {
      if (!after(e.date, e.time)) continue;
      const s = ensure(e.k, e.sku);
      const src = e.inwardRef ? inw.find(i => nk(i.ref) === nk(e.inwardRef)) : null;
      const pref = src ? (x => nk(x.shelf) === nk(src.shelf) && nk(x.batch) === nk(src.batch)) : e.shelf ? (x => nk(x.shelf) === nk(e.shelf)) : null;
      e.alloc = plain(take(s, e.qty, 'dmg', pref));
      s.dmg += e.qty; s.ledger.push({ date: e.date, time: e.time || '', type: 'Damage', ref: e.inwardRef || e.reason || '', qty: -e.qty });
    }
    const untracked = new Map(); const docOwn = new Map();
    mov.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')) || (a.rev ? 1 : 0) - (b.rev ? 1 : 0));
    for (const m of mov) {
      let s = stock.get(m.k);
      if (m.b2bPick) {   // B2B PICK: batch from B2B STOCK, offline untouched
        m.alloc = plain(fromB2B(m.k, Math.abs(m.qty), 'B2B pick')).map(a => ({ ...a, qty: m.qty < 0 ? -a.qty : a.qty }));
        m.offQty = 0; if (s) s.ledger.push({ date: m.date, time: m.time || '', type: 'B2B pick (not offline)', ref: m.ref, party: m.party, qty: 0, note: (m.qty > 0 ? '' : '+') + Math.abs(m.qty) });
        continue;
      }
      if (!s || (!s.inBase && !s.inw)) {   // not in the audit and never inwarded: still offline, it shows negative
        const u = untracked.get(m.k) || { k: m.k, sku: m.sku, qty: 0, refs: new Set() }; u.qty += m.qty; u.refs.add(m.ref); untracked.set(m.k, u);
        if (!s) s = ensure(m.k, m.sku);
      }
      const key = m.ref + '|' + m.k; let own = docOwn.get(key);
      const al = take(s, m.qty, 'out', null, m.qty < 0 ? own : null);
      if (m.qty > 0) { if (!own) { own = { rows: new Map(), b2b: 0 }; docOwn.set(key, own); } for (const a of al) { if (a.r) own.rows.set(a.r, (own.rows.get(a.r) || 0) + a.qty); else own.b2b += a.qty; } }
      m.alloc = plain(al);
      m.offQty = al.filter(a => String(a.src).startsWith('Offline')).reduce((x, a) => x + a.qty, 0);
      s.out[m.type] = (s.out[m.type] || 0) + m.offQty; s.outT += m.offQty; if (m.qty < 0) s.back -= m.qty;
      s.ledger.push({ date: m.date, time: m.time || '', type: m.rev ? (m.qty < 0 ? 'Revise −' : 'Revise +') : m.type, ref: m.ref, party: m.party, qty: -m.offQty, note: m.offQty !== m.qty ? `${Math.abs(m.qty - m.offQty)} from B2B` : '' });
    }
    M.untracked = [...untracked.values()].filter(u => u.qty > 0).map(u => ({ ...u, refs: [...u.refs] }));
    M.shortOff = [...stock.values()].filter(s => s.shortQty > 0 && s.inBase).map(s => ({ k: s.k, sku: s.sku, qty: s.shortQty }));

    /* the clean minus data: one row per doc, SKU and batch, on its packing date */
    const TYP = m => m.rev ? (m.qty < 0 ? 'Revise −' : 'Revise +') : m.type === 'Order' ? 'Packed' : m.type;
    const SRC = { Offline: 'Offline', 'Offline-short': 'Offline (not in stock)', B2B: 'B2B', 'B2B pick': 'B2B pick' };
    M.minusRows = [];
    for (const m of mov) for (const a of (m.alloc && m.alloc.length ? m.alloc : [{ qty: m.qty, shelf: '', batch: '', exp: '', vb: '', src: 'Offline' }]))
      M.minusRows.push({ date: m.date, time: m.time || '', doc: m.ref, party: m.party, type: TYP(m), k: m.k, sku: m.sku, name: names.get(m.k) || '', qty: a.qty, batch: a.batch, vb: a.vb, exp: a.exp, shelf: a.shelf, src: SRC[a.src] || a.src, rev: !!m.rev });

    /* 14-day outward rate (all packed docs + other, independent of snapshot) */
    const from14 = addDays(today, -13); const rate = new Map();
    const addRate = (k, q) => rate.set(k, (rate.get(k) || 0) + q);
    for (const d of M.docs) if (d.packed && !d.b2bPick && d.mv >= from14 && d.mv <= today) for (const l of d.lines) addRate(l.k, l.qty);
    for (const r of otherRows) if (isYes(r.pack) && M.minusTypes.has(r.type) && r.date >= from14 && r.date <= today) addRate(r.k, r.qty);

    for (const s of stock.values()) {
      s.live = s.rows.reduce((a, r) => a + avail(r), 0);
      s.rows.forEach(r => { r.live = avail(r); r.life = life(r.exp, today, M.lifeMonths); });
      s.good = s.rows.filter(r => r.inv !== 'BAD').reduce((a, r) => a + r.live, 0); s.bad = s.live - s.good;
      s.rows.sort((a, b) => ((a.inv === 'BAD') - (b.inv === 'BAD')) || (a.exp || '9999').localeCompare(b.exp || '9999'));
      s.batches = s.rows.filter(r => r.live || r.added).map(r => r.batch).filter(Boolean);
      s.daily = (rate.get(s.k) || 0) / 14; s.cover = s.daily > 0 ? Math.max(0, s.live) / s.daily : null;
      const nearest = s.rows.filter(r => r.live > 0 && r.exp).map(r => r.exp).sort()[0] || '';
      s.nearExp = nearest; s.nearLife = life(nearest, today, M.lifeMonths);
      s.shelves = [...new Set(s.rows.filter(r => r.shelf).map(r => r.shelf))];
      s.state = s.live < 0 ? 'neg' : s.live === 0 ? 'zero' : ((s.cover != null && s.cover < M.coverDays) || s.live < M.minUnits) ? 'low' : 'ok';
      s.ledger.sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
    }
    M.stock = [...stock.values()].sort((a, b) => a.sku.localeCompare(b.sku));
    M.stockMap = stock;
    M.totLive = M.stock.reduce((a, s) => a + Math.max(0, s.live), 0);
    M.totBase = M.stock.reduce((a, s) => a + s.base, 0);
    M.totOut = M.stock.reduce((a, s) => a + s.outT, 0);
    M.totInw = M.stock.reduce((a, s) => a + s.inw, 0);
    M.totDmg = M.stock.reduce((a, s) => a + s.dmg, 0);

    /* Day by day: what left offline stock, by source, from the start date on. */
    const DAYF = ['Order', 'Influencer', 'Consignment', 'Reship', 'Damage', 'Inward', 'Back'];
    const dayMapM = new Map();
    const dayAdd = (date, k, sku, f, q) => {
      if (!date || !q) return;
      let D = dayMapM.get(date); if (!D) { D = { date, skus: new Map(), out: 0, inw: 0, dmg: 0, back: 0, by: {} }; dayMapM.set(date, D); }
      let x = D.skus.get(k); if (!x) { x = { k, sku, name: names.get(k) || '', out: 0 }; for (const ff of DAYF) x[ff] = 0; D.skus.set(k, x); }
      x[f] += q; D.by[f] = (D.by[f] || 0) + q;
      if (f === 'Inward') D.inw += q; else if (f === 'Back') D.back += q; else { x.out += q; if (f === 'Damage') D.dmg += q; D.out += q; }
    };
    for (const m of mov) { const q = m.offQty || 0; if (q < 0) dayAdd(m.date, m.k, m.sku, 'Back', -q); else if (q > 0) dayAdd(m.date, m.k, m.sku, DAYF.includes(m.type) ? m.type : 'Order', q); }
    for (const e of dmg) if (after(e.date, e.time)) dayAdd(e.date, e.k, e.sku, 'Damage', e.qty);
    for (const e of inw) if (after(e.date, e.time)) dayAdd(e.date, e.k, e.sku, 'Inward', e.qty);
    M.dailyFields = DAYF;
    M.daily = [...dayMapM.values()].map(D => ({ ...D, rows: [...D.skus.values()].sort((a, b) => b.out - a.out || a.sku.localeCompare(b.sku)) })).sort((a, b) => b.date.localeCompare(a.date));
    M.dailyMap = new Map(M.daily.map(d => [d.date, d]));

    /* Day-end minus for Uniware: everything packed on a date (orders,
       influencer, consignment, reship, revise +/-) with the batches taken.
       Uniware cannot minus by batch in bulk, so the sheet lists them. */
    const uniDone = new Map(); for (const u of t3.uniLog || []) uniDone.set(u.date, u);
    const dmM = new Map();
    const DMx = date => { let x = dmM.get(date); if (!x) { x = { date, skus: new Map(), docs: new Set(), revDocs: new Set(), pickDocs: new Set(), otherQty: 0, minus: 0, back: 0, dmg: 0, damage: [], inward: [] }; dmM.set(date, x); } return x; };
    for (const m of mov) {
      if (!m.date) continue;
      const D = DMx(m.date); let L = D.skus.get(m.k);
      if (!L) { L = { k: m.k, sku: m.sku, name: names.get(m.k) || '', minus: 0, back: 0, types: {}, refs: new Set(), alloc: new Map(), tracked: stock.has(m.k) }; D.skus.set(m.k, L); }
      if (m.qty > 0) { L.minus += m.qty; D.minus += m.qty; } else { L.back -= m.qty; D.back -= m.qty; }
      const ty = m.rev ? 'Revise' : m.type; L.types[ty] = (L.types[ty] || 0) + m.qty; L.refs.add(m.ref);
      if (m.type === 'Order') { (m.rev ? D.revDocs : D.docs).add(m.ref); if (m.b2bPick) D.pickDocs.add(m.ref); } else D.otherQty += m.qty;
      for (const a of m.alloc || []) { const ak = a.src + '|' + nk(a.shelf) + '|' + nk(a.batch) + '|' + a.inv; const x = L.alloc.get(ak) || { shelf: a.shelf, batch: a.batch, exp: a.exp, vb: a.vb, inv: a.inv, src: SRC[a.src] || a.src, qty: 0 }; x.qty += a.qty; L.alloc.set(ak, x); }
    }
    for (const e of dmg) if (after(e.date, e.time) && e.date) { const D = DMx(e.date); D.dmg += e.qty; D.damage.push(e); }
    for (const e of inw) if (after(e.date, e.time) && e.date) DMx(e.date).inward.push(e);
    M.dayMinus = [...dmM.values()].map(D => {
      /* what Uniware needs is the net per batch: a revise that adds back 5
         where 2 were minused the same day is one add-back of 3 */
      const lines = [...D.skus.values()].map(L => {
        const alloc = [...L.alloc.values()].filter(a => a.qty);
        const net = L.minus - L.back;
        const minus = alloc.length ? alloc.filter(a => a.qty > 0).reduce((x, a) => x + a.qty, 0) : Math.max(0, net);
        const back = alloc.length ? -alloc.filter(a => a.qty < 0).reduce((x, a) => x + a.qty, 0) : Math.max(0, -net);
        return { ...L, gMinus: L.minus, gBack: L.back, minus, back, refs: [...L.refs], alloc };
      }).filter(L => L.minus || L.back || L.gMinus || L.gBack).sort((a, b) => a.sku.localeCompare(b.sku));
      const minus = lines.reduce((x, L) => x + L.minus, 0), back = lines.reduce((x, L) => x + L.back, 0);
      const done = uniDone.get(D.date) || null;
      const state = done ? ((done.qty === minus && done.back === back) ? 'done' : 'changed') : (minus || back) ? 'open' : 'none';
      return { date: D.date, lines, docs: [...D.docs], revDocs: [...D.revDocs], pickDocs: [...D.pickDocs], otherQty: D.otherQty, minus, back, gMinus: D.minus, gBack: D.back, dmg: D.dmg, damage: D.damage, inward: D.inward, done, state };
    }).sort((a, b) => b.date.localeCompare(a.date));
    M.dayMinusMap = new Map(M.dayMinus.map(d => [d.date, d]));
    M.dayOpen = M.dayMinus.filter(d => d.state === 'open' || d.state === 'changed');

    /* inward review window (damage counter) */
    const dmgByRef = new Map(); for (const e of dmg) if (e.inwardRef) dmgByRef.set(nk(e.inwardRef), (dmgByRef.get(nk(e.inwardRef)) || 0) + e.qty);
    for (const e of inw) {
      e.damaged = dmgByRef.get(nk(e.ref)) || 0;
      e.daysIn = diffDays(e.date, today); e.daysLeft = M.window - (e.daysIn ?? 0);
      e.windowOpen = e.daysIn != null && e.daysIn <= M.window;
      e.review = e.damaged > 0 ? (e.windowOpen ? 'Damage logged · open' : 'Damage claimed') : e.reviewed ? 'Checked · no damage' : e.windowOpen ? 'Review open' : 'Closed · no damage';
    }
    for (const e of dmg) {
      const ref = e.inwardRef ? inw.find(i => nk(i.ref) === nk(e.inwardRef)) : null;
      const within = ref ? diffDays(ref.date, e.date) <= M.window : false;
      e.kind = ref && within ? 'Vendor' : 'Internal';
    }

    /* pending & demand (FIFO by approval date) */
    const pend = M.docs.filter(d => d.status === 'pending').sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
    const pool = new Map(M.stock.map(s => [s.k, Math.max(0, s.live)]));
    const demand = new Map();
    for (const d of pend) {
      d.short = 0; d.need = 0;
      if (d.b2bPick) { d.need = d.pcs; d.ready = d.lines.length ? true : null; continue; }
      for (const l of d.lines) {
        const have = pool.get(l.k) || 0; const cov = Math.min(have, l.qty); pool.set(l.k, have - cov);
        l.cover = cov; l.short = l.qty - cov; d.need += l.qty; d.short += l.short;
        const x = demand.get(l.k) || { k: l.k, sku: l.sku, demand: 0, docs: 0 }; x.demand += l.qty; x.docs++; demand.set(l.k, x);
      }
      d.ready = d.lines.length ? d.short === 0 : null;
    }
    M.pending = pend;
    M.toDispatch = M.docs.filter(d => d.status === 'packed').sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const b2bAgg = aggB2B(t2, today, M);
    M.b2b = b2bAgg;
    M.demand = [...demand.values()].map(x => {
      const s = stock.get(x.k); const live = s ? Math.max(0, s.live) : 0; const short = Math.max(0, x.demand - live);
      const b = b2bAgg.map.get(x.k); const b2bAvail = b ? b.wh : 0; const cs = (t3.cases.get(x.k) || [])[0] || 0;
      let suggest = 0; if (short > 0) { suggest = cs ? Math.ceil(short / cs) * cs : short; suggest = Math.min(suggest, Math.max(0, b2bAvail)); }
      return { ...x, name: names.get(x.k) || '', live, short, b2b: b2bAvail, caseSize: cs, suggest, tracked: !!s, fefoBatch: b ? b.fefo : null };
    }).sort((a, b) => b.short - a.short || b.demand - a.demand);
    const dTot = M.demand.reduce((a, x) => a + x.demand, 0);
    M.fillQty = dTot ? M.demand.reduce((a, x) => a + Math.min(x.demand, x.live), 0) / dTot : null;
    M.fillSku = M.demand.length ? M.demand.filter(x => x.short === 0).length / M.demand.length : null;
    M.fillDoc = pend.filter(d => d.lines.length).length ? pend.filter(d => d.ready).length / pend.filter(d => d.lines.length).length : null;

    /* dispatch by day */
    const byDay = new Map();
    const day = k => { if (!byDay.has(k)) byDay.set(k, { date: k, docs: [], other: [], pcs: 0, couriers: new Map(), skus: new Map() }); return byDay.get(k); };
    for (const d of M.docs) if (d.dispatched) { const x = day(d.dd); x.docs.push(d); x.pcs += d.pcs; const c = d.courier || 'Not set'; x.couriers.set(c, (x.couriers.get(c) || 0) + 1); for (const l of d.lines) x.skus.set(l.k, { sku: l.sku, qty: ((x.skus.get(l.k) || {}).qty || 0) + l.qty }); }
    for (const r of otherRows) if (r.date && sentOut(r.disp)) { const x = day(r.date); x.other.push(r); x.pcs += r.qty; x.skus.set(r.k, { sku: r.sku, qty: ((x.skus.get(r.k) || {}).qty || 0) + r.qty }); }
    M.days = [...byDay.values()].sort((a, b) => b.date.localeCompare(a.date));
    M.dayMap = byDay;

    /* KPIs */
    const dispatched = M.docs.filter(d => d.dispatched);
    const withDays = dispatched.filter(d => d.days != null && d.days >= 0);
    M.k = {
      docs: M.docs.length, packed: M.docs.filter(d => d.packed).length, dispatched: dispatched.length,
      pending: pend.length, toDispatch: M.toDispatch.length,
      withData: M.docs.filter(d => d.lines.length).length,
      uploaded: dispatched.filter(d => d.uploaded).length,
      avgDays: withDays.length ? withDays.reduce((a, d) => a + d.days, 0) / withDays.length : null,
      onTime: withDays.length ? withDays.filter(d => d.days <= M.sla).length / withDays.length : null,
      pcsDispatched: dispatched.reduce((a, d) => a + d.pcs, 0),
      pendingPcs: pend.reduce((a, d) => a + d.need, 0),
      overdue: pend.filter(d => d.age != null && d.age > M.sla).length,
      todayDocs: (byDay.get(today) || { docs: [] }).docs.length, todayPcs: (byDay.get(today) || { pcs: 0 }).pcs,
      todayApproved: M.docs.filter(d => d.date === today).length,
      todayPacked: M.docs.filter(d => d.packed && d.mv === today).length,
      todayMinus: (M.dailyMap.get(today) || { out: 0 }).out,
      low: M.stock.filter(s => s.state === 'low').length, neg: M.stock.filter(s => s.state === 'neg').length, zero: M.stock.filter(s => s.state === 'zero').length,
      expiring: M.stock.reduce((a, s) => a + s.rows.filter(r => r.live > 0 && r.life && r.life.pct < 0.33).length, 0),
      openReviews: inw.filter(e => e.windowOpen && !e.reviewed && !e.damaged).length,
      b2bPick: M.b2bPickDocs.length,
      b2bPickPcs: M.b2bPickDocs.reduce((a, d) => a + d.pcs, 0),
      revised: M.revisedDocs.length,
      otherPcs: otherRows.filter(r => isYes(r.pack)).reduce((a, r) => a + r.qty, 0)
    };
    /* Month by month, so a new month or a new year never mixes with the last. */
    const mon = new Map();
    const mm = k => k ? k.slice(0, 7) : '';
    const MB = k => { let x = mon.get(k); if (!x) { x = { key: k, approved: 0, packed: 0, dispatched: 0, pcsOut: 0, minus: 0, inward: 0, damage: 0, daysSum: 0, daysN: 0, onTime: 0 }; mon.set(k, x); } return x; };
    for (const d of M.docs) {
      if (d.date) MB(mm(d.date)).approved++;
      if (d.packed && d.mv) MB(mm(d.mv)).packed++;
      if (d.dispatched) { const x = MB(mm(d.dd)); x.dispatched++; x.pcsOut += d.pcs; if (d.days != null && d.days >= 0) { x.daysSum += d.days; x.daysN++; if (d.days <= M.sla) x.onTime++; } }
    }
    for (const D of M.daily) { const x = MB(mm(D.date)); x.minus += D.out - D.dmg - (D.back || 0); x.back = (x.back || 0) + (D.back || 0); x.damage += D.dmg; x.inward += D.inw; }
    M.months = [...mon.values()].filter(x => /^\d{4}-\d{2}$/.test(x.key)).sort((a, b) => b.key.localeCompare(a.key));
    M.monthMap = new Map(M.months.map(x => [x.key, x]));
    const cour = new Map(); for (const d of dispatched) { const c = d.courier || 'Not set'; cour.set(c, (cour.get(c) || 0) + 1); }
    M.couriers = [...cour.entries()].sort((a, b) => b[1] - a[1]);
    const dist = [0, 0, 0, 0, 0, 0]; for (const d of withDays) dist[Math.min(5, Math.max(0, Math.round(d.days)))]++; M.daysDist = dist;
    const series = []; for (let i = 13; i >= 0; i--) { const k = addDays(today, -i); series.push({ k, appr: 0, packed: 0, disp: 0, pcs: 0 }); }
    const sIdx = new Map(series.map((s, i) => [s.k, i]));
    for (const d of M.docs) { if (sIdx.has(d.date)) series[sIdx.get(d.date)].appr++; if (d.packed && sIdx.has(d.mv)) series[sIdx.get(d.mv)].packed++; if (d.dispatched && sIdx.has(d.dd)) { series[sIdx.get(d.dd)].disp++; series[sIdx.get(d.dd)].pcs += d.pcs; } }
    M.series = series;
    const top = new Map(); for (const x of M.days.filter(x => x.date >= addDays(today, -6))) for (const [k, v] of x.skus) top.set(k, { sku: v.sku, qty: ((top.get(k) || {}).qty || 0) + v.qty });
    M.topSku = [...top.values()].sort((a, b) => b.qty - a.qty).slice(0, 8);

    /* stationary */
    /* Pen and marker: one each for every person. Cutter and tape guns are
       shared inside a team. When a team writes the same tool count on every
       member's row it is one team figure, so it is counted once. */
    M.stationary = t2.stationary;
    const TOOLS = ['cutter', 'g3', 'g2'];
    const tmap = new Map();
    for (const p of t2.stationary) { const t = str(p.team) || 'No team'; if (!tmap.has(t)) tmap.set(t, []); tmap.get(t).push(p); }
    M.teams = [...tmap.entries()].map(([team, mem]) => {
      const tools = {}, repeat = {};
      for (const t of TOOLS) {

V.dispatch = () => {

  else if (u.range) { const from = addDays(M.today, -(u.range - 1)); const ds = M.days.filter(d => d.date >= from && d.date <= M.today); sel = mergeDays(ds); label = `Last ${u.range} days`; }
  else { sel = M.dayMap.get(u.date) || { date: u.date, docs: [], other: [], pcs: 0, couriers: new Map(), skus: new Map() }; label = fD(u.date); }

};
function mergeDays(ds) { const o = { docs: [], other: [], pcs: 0, couriers: new Map(), skus: new Map() }; for (const d of ds) { o.docs.push(...d.docs); o.other.push(...d.other); o.pcs += d.pcs; for (const [c, n] of d.couriers) o.couriers.set(c, (o.couriers.get(c) || 0) + n); for (const [k, v] of d.skus) o.skus.set(k, { sku: v.sku, qty: ((o.skus.get(k) || {}).qty || 0) + v.qty }); } return o; }

/* what a scan does from the header, the lookup page or a hardware scanner */
function scanGo(r) {

  return { ok: false, msg: unknownMsg(r) };
}
function scanGlobal() {
  if (!st.M) { toast('Wait for the sheets to load'); return; }

function pickInto(inp, k) {

function scanIntoField(id) {

/* count by scanning: every time the barcode comes into view it adds one */
function scanCount(qtyId) {
  const f = $('#fSku'), q = document.getElementById(qtyId); if (!f || !q || !st.M) return;
  let k = f.dataset.k || ''; const start = Math.max(0, Math.round(num(q.value))); let n = 0;
  const cs = () => (st.t3.cases.get(k) || [])[0] || 0;
  const label = () => { const c = cs(), tot = start + n, fc = c ? Math.floor(tot / c) : 0; return k ? `${skuName(k)}${!c ? '' : fc ? ` · ${fc} case${fc === 1 ? '' : 's'}${tot % c ? ' + ' + (tot % c) + ' loose' : ''}` : ` · case of ${c}`}` : 'counted'; };
  SCAN.open({
    mode: 'count', title: 'Scan each piece', hint: k ? `Counting ${skuName(k)} — show each piece once` : 'Scan the first piece to pick the SKU',
    count: start || null, countLabel: label(),
    onCode: c => {
      const r = resolveCode(c);
      if (r.kind !== 'sku') return { ok: false, msg: r.kind === 'multi' ? 'Several SKUs share this EAN — pick the SKU by typing first' : unknownMsg(r) };
      if (!k) { k = r.k; pickInto(f, k); }
      else if (r.k !== k) return { ok: false, msg: `That is ${skuName(r.k)}. Finish ${skuName(k)} first, then save.` };
      n++; q.value = start + n; q.dispatchEvent(new Event('input', { bubbles: true }));
      return { ok: true, count: start + n, countLabel: label(), msg: `+1 ${skuName(k)}` };
    },
    onClose: () => { if (n) toast(`${n} scanned · qty ${start + n}`); }
  });
}
document.addEventListener('click', e => {

  const b = e.target.closest('[data-scancount]'); if (b) { e.preventDefault(); scanCount(b.dataset.scancount); return; }

/* Enter in a SKU box: an EAN picks its SKU, otherwise the first suggestion — never submits the form half filled */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const inp = e.target.closest && e.target.closest('input[data-ac="sku"]'); if (!inp || !st.M || inp.id === 'lkQ') return;
  e.preventDefault();
  const r = resolveCode(inp.value);
  if (r.kind === 'sku') { pickInto(inp, r.k); SND.play('scan'); SND.buzz(25); return; }
  const it = inp.parentElement.querySelector('.ac-list.show .ac-item'); if (it) { it.click(); return; }

/* hardware barcode scanners type fast and press Enter */
(() => {
  let buf = '', first = 0, last = 0, startEl = null, startVal = '';
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target, inField = t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
    const now = performance.now();
    if (now - last > 80) { buf = ''; first = now; startEl = inField ? t : null; startVal = inField ? t.value : ''; }
    last = now;
    if (e.key === 'Enter') {
      const code = buf; buf = '';
      const fast = code.length >= 6 && (now - first) < code.length * 50 + 100;
      // a scanner aimed at a qty box: put the box back and count one piece instead
      if (fast && st.M && inField && t === startEl && /^(fQty|fCount)$/.test(t.id) && /^\d{6,14}$/.test(code)) {
        e.preventDefault(); t.value = startVal;
        const f = $('#fSku'), r = resolveCode(code);
        if (r.kind !== 'sku') { SND.play('error'); SND.buzz([60, 40, 60]); toast(unknownMsg(r)); return; }
        if (f && !f.dataset.k) pickInto(f, r.k);
        else if (f && f.dataset.k !== r.k) { SND.play('error'); SND.buzz([60, 40, 60]); toast(`That is ${skuName(r.k)}, not ${skuName(f.dataset.k)}`); return; }
        t.value = Math.max(0, Math.round(num(startVal))) + 1; startVal = t.value;
        t.dispatchEvent(new Event('input', { bubbles: true })); SND.play('count'); SND.buzz(20); toast(`+1 ${skuName(r.k)} · now ${t.value}`);
        return;
      }
      if (!fast || inField || !st.M) return;
      e.preventDefault();
      if (SCAN.isOpen()) { SCAN.handle(code); return; }
      const r = resolveCode(code); const res = scanGo(r);
      if (res.ok) { SND.play('scan'); SND.buzz(30); res.after && res.after(); } else { SND.play('error'); toast(res.msg); }
      return;
    }
    if (e.key.length === 1) buf += e.key;
  }, true);
})();

})();

function sheetsFor(kind, opt = {}) {

async function doExport(kind) {

function xbook(S, filename) {
  if (!window.XLSX) { toast('Export is still loading — try again in a moment'); return false; }
  const wb = XLSX.utils.book_new(); const used = new Set();
  for (const [n0, a] of Object.entries(S)) {
    if (!a || !a.length) continue;
    let n = n0.replace(/[\\/?*\[\]:]/g, '-').slice(0, 31); while (used.has(n)) n = n.slice(0, 28) + '_' + used.size; used.add(n);
    const ws = XLSX.utils.aoa_to_sheet(a); ws['!cols'] = a[0].map((h, i) => ({ wch: Math.min(42, Math.max(String(h).length + 2, ...a.slice(1, 200).map(r => String(r[i] ?? '').length + 1))) }));
    XLSX.utils.book_append_sheet(wb, ws, n);
  }
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: XMIME })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast('Downloaded ' + filename); SND.play('success');
  return true;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-exp]'); if (b) { e.preventDefault(); doExport(b.dataset.exp); } });

/* ================= MAIL (Gmail) =================
   One mail thread per mailbox (B2B requests, packing material). Every send
   finds the latest message of that subject in the signed-in mailbox and
   replies to it with In-Reply-To / References, so everybody sees one thread.
   The first message id is kept in APP SETTINGS so every phone joins the same
   thread. Replies from the B2B team are read and their table is saved in the
   B2B IN tab of Test 3. */
const GAPI = 'https://gmail.googleapis.com/gmail/v1/users/me/';
const GM = (() => {
  let lastPoll = 0, polling = false;
  const ok = () => tokOk() && !!tok.gm;
  function connect() {
    if (AUTH.helper()) { lss('dt-gm', '1'); AUTH.login(true); return; }
    if (!initTc()) { toast('Google sign-in is still loading — try again in a moment'); return; }
    lss('dt-gm', '1'); st.gmAsk = true;
    tc.requestAccessToken({ prompt: 'consent', login_hint: (tok && tok.email) || lsg('dt-email') || undefined, scope: scopesNow() });
  }
  function disconnect() { lss('dt-gm', null); if (tok) { tok.gm = false; lss('dt-tok', JSON.stringify(tok)); } render(); }
  const b64 = s => { const by = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
  const b64u = s => b64(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const wrap = s => s.replace(/.{1,76}/g, '$&\r\n');
  const encH = s => /^[\x20-\x7e]*$/.test(s) ? s : '=?UTF-8?B?' + b64(s) + '?=';
  const list = v => String(v || '').split(/[,;\s]+/).map(x => x.trim()).filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
  function mime(o) {
    const bnd = 'dt_' + uid();
    return [`To: ${o.to.join(', ')}`, o.cc.length ? `Cc: ${o.cc.join(', ')}` : null, `Subject: ${encH(o.subject)}`, 'MIME-Version: 1.0',
      o.inReplyTo ? `In-Reply-To: ${o.inReplyTo}` : null, o.references ? `References: ${o.references}` : null,
      `Content-Type: multipart/alternative; boundary="${bnd}"`, '',
      `--${bnd}`, 'Content-Type: text/plain; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', wrap(b64(o.text)),
      `--${bnd}`, 'Content-Type: text/html; charset=UTF-8', 'Content-Transfer-Encoding: base64', '', wrap(b64(o.html)), `--${bnd}--`, ''].filter(x => x !== null).join('\r\n');
  }
  const hdr = (m, n) => { const h = ((m.payload && m.payload.headers) || []).find(x => x.name.toLowerCase() === n.toLowerCase()); return h ? h.value : ''; };
  const subjOf = kind => (st.cfg[kind + 'Subject'] || DEF_CFG[kind + 'Subject']).trim();
  const q = kind => `subject:"${subjOf(kind).replace(/"/g, '')}"`;
  async function gm(url, opt) {
    try { return await gfetch(url, opt); }
    catch (e) {
      if (e && e.status === 403 && /not been used|disabled/i.test(e.message || '')) throw { code: 'gmapi', message: 'The Gmail API is not switched on in your Google Cloud project. Open APIs & Services → Library → Gmail API → Enable.' };
      if (e && (e.status === 403 || e.status === 401)) { if (tok) tok.gm = false; throw { code: 'gmscope', message: 'Gmail permission is missing — tap Connect Gmail in Settings.' }; }
      throw e;
    }
  }
  async function thread(kind) {
    const r = await gm(GAPI + 'messages?maxResults=1&includeSpamTrash=false&q=' + encodeURIComponent(q(kind) + ' newer_than:365d'));
    if (!r.messages || !r.messages.length) return null;
    const m = await gm(GAPI + 'messages/' + r.messages[0].id + '?format=metadata&metadataHeaders=Message-ID&metadataHeaders=References');
    return { threadId: m.threadId, msgId: hdr(m, 'Message-ID'), refs: hdr(m, 'References') };

  });
}

    $('#rbForm').onsubmit = e => { e.preventDefault(); const v = $('#rbQ').value.trim(); if (!v) return; $('#rbQ').value = ''; ask(v); };
    $$('[data-rbq]').forEach(b => b.onclick = () => ask(b.textContent));
  }
  document.addEventListener('click', e => { if (e.target.closest('#rbBell')) { NT.panel(); } });
  return { mount, show, set, say, hide, busy, chat, answer, robot };
})();

window.__dt.robo = ROBO;

render();
try { boot(); } catch (e) { console.error(e); st.err.t2 = { code: 'boot', message: 'The app could not start: ' + (e.message || e) }; hideSplash(); render(); }
})();
